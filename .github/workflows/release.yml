name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gamm-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gamm-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gamm-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gamm-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BIN=target/${{ matrix.target }}/release/gamm
          $BIN version
          $BIN --help
          $BIN repo list
          $BIN profile list

      - name: Test binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $BIN = "target\${{ matrix.target }}\release\gamm.exe"
          & $BIN version
          & $BIN --help
          & $BIN repo list
          & $BIN profile list

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/gamm ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/gamm.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
